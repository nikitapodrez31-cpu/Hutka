<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hutka</title>

  <meta
    name="description"
    content="Hutka — беларуская сацыяльная сетка"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f5f5;
      --card: #fff;
      --text: #171717;
      --muted: #777;
      --border: #e5e5e5;
      --accent: #111;
      --danger: #d33;
      --radius: 18px;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .hidden {
      display: none !important;
    }

    .app {
      min-height: 100vh;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 64px;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1100px;
      height: 100%;
      margin: auto;
      padding: 0 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      font-size: 13px;
      color: var(--muted);
      margin-left: 6px;
      font-weight: 500;
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #ddd;
      object-fit: cover;

      display: flex;
      align-items: center;
      justify-content: center;

      font-weight: 700;
      color: #555;
      flex-shrink: 0;
    }

    .small-btn {
      border: 1px solid var(--border);
      background: white;
      border-radius: 12px;
      padding: 8px 12px;
    }

    /* LAYOUT */

    .layout {
      max-width: 1100px;
      margin: auto;
      padding: 22px 18px;

      display: grid;
      grid-template-columns: 220px minmax(0, 600px) 220px;
      gap: 20px;
    }

    .sidebar,
    .rightbar {
      position: sticky;
      top: 86px;
      height: fit-content;
    }

    .nav {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
    }

    .nav button {
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 2px;
    }

    .nav button:hover {
      background: #f1f1f1;
    }

    .nav button.active {
      background: #111;
      color: white;
    }

    /* SEARCH */

    .search {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px 13px;
      width: 100%;
      outline: none;
    }

    .search:focus {
      border-color: #aaa;
    }

    /* CARDS */

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 15px;
    }

    .composer textarea {
      width: 100%;
      min-height: 95px;
      resize: vertical;

      border: 0;
      outline: 0;
      font-size: 16px;
      background: transparent;
    }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .photo-label {
      cursor: pointer;
      border: 1px solid var(--border);
      padding: 9px 13px;
      border-radius: 12px;
      background: white;
    }

    .photo-label input {
      display: none;
    }

    .primary {
      border: 0;
      background: #111;
      color: white;
      padding: 10px 17px;
      border-radius: 12px;
      font-weight: 650;
    }

    .primary:disabled {
      opacity: .5;
      cursor: default;
    }

    /* POST */

    .post-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .post-user {
      flex: 1;
      min-width: 0;
    }

    .post-name {
      font-weight: 700;
    }

    .post-handle {
      color: var(--muted);
      font-size: 13px;
    }

    .post-date {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .post-text {
      margin: 14px 0;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
    }

    .post-image {
      width: 100%;
      max-height: 600px;
      object-fit: cover;
      border-radius: 14px;
      margin-top: 10px;
    }

    .post-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .post-actions button {
      border: 0;
      background: #f4f4f4;
      padding: 8px 12px;
      border-radius: 10px;
      color: #444;
    }

    .post-actions button:hover {
      background: #e9e9e9;
    }

    .post-actions button.liked {
      background: #111;
      color: white;
    }

    /* COMMENTS */

    .comments-box {
      margin-top: 14px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    .comment {
      display: flex;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .comment:last-child {
      border-bottom: 0;
    }

    .comment-content {
      flex: 1;
      min-width: 0;
    }

    .comment-author {
      font-weight: 700;
      font-size: 14px;
    }

    .comment-text {
      margin-top: 3px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .comment-date {
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
    }

    .comment-delete {
      border: 0;
      background: transparent;
      color: var(--danger);
      font-size: 12px;
      padding: 3px;
    }

    .comment-form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .comment-form input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 9px 11px;
      outline: none;
    }

    .comment-form button {
      border: 0;
      background: #111;
      color: white;
      border-radius: 11px;
      padding: 9px 13px;
    }

    /* RIGHT BAR */

    .info-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .info-title {
      font-weight: 750;
      margin-bottom: 8px;
    }

    .muted {
      color: var(--muted);
    }

    /* AUTH */

    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 50px rgba(0,0,0,.07);
    }

    .auth-title {
      font-size: 32px;
      font-weight: 850;
      margin-bottom: 5px;
    }

    .auth-subtitle {
      color: var(--muted);
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 650;
      margin-bottom: 6px;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: white;
    }

    .field textarea {
      resize: vertical;
      min-height: 100px;
    }

    .auth-card .primary {
      width: 100%;
      margin-top: 5px;
    }

    .auth-switch {
      margin-top: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .link-btn {
      border: 0;
      background: transparent;
      font-weight: 700;
      padding: 0;
    }

    /* PROFILE */

    .profile-head {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .profile-avatar {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
    }

    .profile-name {
      font-size: 22px;
      font-weight: 800;
    }

    .profile-stats {
      display: flex;
      gap: 20px;
      margin-top: 15px;
    }

    .stat strong {
      display: block;
    }

    .stat span {
      color: var(--muted);
      font-size: 13px;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .modal-card {
      background: white;
      border-radius: 22px;
      padding: 22px;
      width: 100%;
      max-width: 450px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .close {
      border: 0;
      background: #f1f1f1;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      font-size: 20px;
    }

    /* SEARCH RESULTS */

    .result {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .result:last-child {
      border-bottom: 0;
    }

    .result-user {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* EMPTY */

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    /* TOAST */

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;

      background: #111;
      color: white;

      padding: 11px 17px;
      border-radius: 12px;

      max-width: calc(100% - 40px);
      text-align: center;
    }

    /* MOBILE */

    @media (max-width: 850px) {
      .layout {
        grid-template-columns: 1fr;
        max-width: 650px;
      }

      .sidebar,
      .rightbar {
        position: static;
      }

      .sidebar {
        order: 2;
      }

      .rightbar {
        display: none;
      }

      .nav {
        display: flex;
        gap: 5px;
        overflow-x: auto;
      }

      .nav button {
        width: auto;
        white-space: nowrap;
      }
    }

    @media (max-width: 500px) {
      .header-inner {
        padding: 0 12px;
      }

      .layout {
        padding: 12px;
      }

      .card {
        border-radius: 15px;
        padding: 14px;
      }

      .logo span {
        display: none;
      }

      .header-user .small-btn {
        max-width: 130px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .post-date {
        display: none;
      }

      .comment-form {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div id="app"></div>

<div id="toast" class="toast hidden"></div>


<!-- =========================================================
     AUTH
========================================================= -->

<div id="authScreen" class="auth-screen hidden">

  <div class="auth-card">

    <div class="auth-title">
      Hutka
    </div>

    <div class="auth-subtitle">
      Маленькая беларуская социальная сеть.
    </div>


    <!-- LOGIN -->

    <form id="loginForm">

      <div class="field">
        <label>Username</label>

        <input
          id="loginUsername"
          type="text"
          autocomplete="username"
          placeholder="@username"
          required
        >
      </div>

      <div class="field">
        <label>Пароль</label>

        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          placeholder="••••••••"
          required
        >
      </div>

      <button
        class="primary"
        type="submit"
      >
        Увайсці
      </button>

    </form>


    <!-- REGISTER -->

    <form
      id="registerForm"
      class="hidden"
    >

      <div class="field">
        <label>Имя</label>

        <input
          id="registerName"
          type="text"
          placeholder="Твоё имя"
          required
        >
      </div>

      <div class="field">
        <label>Username</label>

        <input
          id="registerUsername"
          type="text"
          placeholder="username"
          required
        >
      </div>

      <div class="field">
        <label>Пароль</label>

        <input
          id="registerPassword"
          type="password"
          autocomplete="new-password"
          placeholder="Минимум 6 символов"
          required
        >
      </div>

      <button
        class="primary"
        type="submit"
      >
        Стварыць акаунт
      </button>

    </form>


    <div class="auth-switch">

      <span id="loginSwitch">
        Нет аккаунта?

        <button
          class="link-btn"
          id="showRegister"
          type="button"
        >
          Регистрация
        </button>
      </span>

      <span
        id="registerSwitch"
        class="hidden"
      >
        Уже есть аккаунт?

        <button
          class="link-btn"
          id="showLogin"
          type="button"
        >
          Войти
        </button>
      </span>

    </div>

  </div>

</div>


<!-- =========================================================
     MAIN APP
========================================================= -->

<div id="mainApp" class="hidden">

  <header>

    <div class="header-inner">

      <div
        class="logo"
        style="cursor:pointer"
        onclick="showFeed()"
      >
        Hutka
        <span>Беларусь</span>
      </div>

      <div class="header-user">

        <button
          class="small-btn"
          onclick="openProfile()"
        >
          <span id="headerUserName">
            Профиль
          </span>
        </button>

        <div
          id="headerAvatar"
          class="avatar"
        >
          ?
        </div>

      </div>

    </div>

  </header>


  <div class="layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="nav">

        <button
          id="navFeed"
          class="active"
          onclick="showFeed()"
        >
          🏠 Лента
        </button>

        <button
          id="navSearch"
          onclick="showSearch()"
        >
          🔎 Пошук
        </button>

        <button
          onclick="openProfile()"
        >
          👤 Профіль
        </button>

        <button
          onclick="logout()"
        >
          ↪️ Выйсці
        </button>

      </div>

    </aside>


    <!-- CONTENT -->

    <main id="content">


      <!-- FEED -->

      <section id="feedView">

        <div class="card composer">

          <textarea
            id="postText"
            maxlength="280"
            placeholder="Што новага?"
          ></textarea>

          <div class="composer-bottom">

            <label class="photo-label">

              📷 Фото

              <input
                id="postPhoto"
                type="file"
                accept="image/jpeg,image/png,image/webp,image/gif"
              >

            </label>

            <button
              id="publishBtn"
              class="primary"
              onclick="createPost()"
            >
              Апублікаваць
            </button>

          </div>

          <div
            id="selectedPhoto"
            class="muted"
            style="margin-top:8px;font-size:13px"
          ></div>

        </div>

        <div id="feed"></div>

      </section>


      <!-- SEARCH -->

      <section
        id="searchView"
        class="hidden"
      >

        <div class="card">

          <input
            id="searchInput"
            class="search"
            placeholder="Пошук людзей і пастоў..."
            autocomplete="off"
          >

        </div>

        <div id="searchResults"></div>

      </section>


      <!-- PROFILE -->

      <section
        id="profileView"
        class="hidden"
      >

        <div id="profileContent"></div>

      </section>

    </main>


    <!-- RIGHT -->

    <aside class="rightbar">

      <div class="info-card">

        <div class="info-title">
          Hutka 🇧🇾
        </div>

        <div class="muted">
          Маленькая сетка для вялікіх гісторый.
        </div>

      </div>

    </aside>

  </div>

</div>


<!-- =========================================================
     EDIT PROFILE MODAL
========================================================= -->

<div
  id="profileModal"
  class="modal hidden"
>

  <div class="modal-card">

    <div class="modal-head">

      <strong>
        Рэдагаваць профіль
      </strong>

      <button
        class="close"
        onclick="closeProfileModal()"
      >
        ×
      </button>

    </div>


    <form id="profileForm">

      <div class="field">

        <label>Имя</label>

        <input
          id="profileName"
          required
        >

      </div>


      <div class="field">

        <label>Username</label>

        <input
          id="profileUsername"
          required
        >

      </div>


      <div class="field">

        <label>О себе</label>

        <textarea
          id="profileBio"
          maxlength="300"
        ></textarea>

      </div>


      <div class="field">

        <label>Аватар</label>

        <input
          id="profileAvatar"
          type="file"
          accept="image/jpeg,image/png,image/webp,image/gif"
        >

      </div>


      <button
        class="primary"
        type="submit"
      >
        Сохранить
      </button>

    </form>

  </div>

</div>


<script>

/* =========================================================
   API
========================================================= */

const API_URL =
  'https://hutka-server.onrender.com';

let currentUser = null;


/* =========================================================
   HELPERS
========================================================= */

function apiUrl(path) {
  return API_URL + path;
}


function showToast(message) {

  const toast =
    document.getElementById('toast');

  toast.textContent =
    message;

  toast.classList.remove(
    'hidden'
  );

  clearTimeout(
    window.__toastTimer
  );

  window.__toastTimer =
    setTimeout(
      () => {
        toast.classList.add(
          'hidden'
        );
      },
      3500
    );
}


async function api(
  path,
  options = {}
) {

  const config = {
    credentials: 'include',
    ...options
  };

  let response;

  try {

    response =
      await fetch(
        apiUrl(path),
        config
      );

  } catch (error) {

    console.error(
      'FETCH ERROR:',
      error
    );

    throw new Error(
      'Не удалось подключиться к серверу Hutka. Проверь, запущен ли Render.'
    );
  }


  let data = {};

  const contentType =
    response.headers.get(
      'content-type'
    ) || '';


  if (
    contentType.includes(
      'application/json'
    )
  ) {

    try {

      data =
        await response.json();

    } catch {

      data = {};

    }

  } else {

    const text =
      await response.text();

    data = {
      error:
        text ||
        `Ошибка сервера: ${response.status}`
    };

  }


  if (!response.ok) {

    throw new Error(
      data.error ||
      `Ошибка сервера: ${response.status}`
    );

  }


  return data;
}


function escapeHtml(value) {

  return String(
    value ?? ''
  )
    .replaceAll(
      '&',
      '&amp;'
    )
    .replaceAll(
      '<',
      '&lt;'
    )
    .replaceAll(
      '>',
      '&gt;'
    )
    .replaceAll(
      '"',
      '&quot;'
    )
    .replaceAll(
      "'",
      '&#039;'
    );
}


function initials(name) {

  const value =
    String(
      name || '?'
    ).trim();

  if (!value) {
    return '?';
  }

  return value
    .split(/\s+/)
    .slice(0, 2)
    .map(
      x => x[0]
    )
    .join('')
    .toUpperCase();
}


function mediaUrl(url) {

  if (!url) {
    return '';
  }

  if (
    url.startsWith('http://') ||
    url.startsWith('https://')
  ) {
    return url;
  }

  return API_URL + url;
}


function avatarHtml(
  user,
  className = 'avatar'
) {

  if (user?.avatar) {

    return `
      <img
        class="${className}"
        src="${escapeHtml(
          mediaUrl(user.avatar)
        )}"
        alt=""
        loading="lazy"
      >
    `;

  }

  return `
    <div class="${className}">
      ${escapeHtml(
        initials(user?.name)
      )}
    </div>
  `;
}


function formatDate(date) {

  try {

    return new Intl.DateTimeFormat(
      'ru-RU',
      {
        day: 'numeric',
        month: 'short',
        hour: '2-digit',
        minute: '2-digit'
      }
    ).format(
      new Date(date)
    );

  } catch {

    return '';

  }
}


/* =========================================================
   AUTH
========================================================= */

async function checkAuth() {

  try {

    const data =
      await api('/api/me');

    if (data.user) {

      currentUser =
        data.user;

      showMainApp();

      await loadFeed();

    } else {

      showAuth();

    }

  } catch (error) {

    console.error(error);

    showAuth();

  }
}


function showAuth() {

  document
    .getElementById('authScreen')
    .classList.remove('hidden');

  document
    .getElementById('mainApp')
    .classList.add('hidden');
}


function showMainApp() {

  document
    .getElementById('authScreen')
    .classList.add('hidden');

  document
    .getElementById('mainApp')
    .classList.remove('hidden');

  updateHeader();
}


function updateHeader() {

  if (!currentUser) {
    return;
  }

  document
    .getElementById(
      'headerUserName'
    )
    .textContent =

/* =========================================================
   FEED
========================================================= */

async function loadFeed() {

  const feed =
    document.getElementById(
      'feed'
    );


  feed.innerHTML = `
    <div class="empty">
      Загружаем Hutka...
    </div>
  `;


  try {

    const data =
      await api(
        '/api/posts'
      );


    renderPosts(
      data.posts || []
    );


  } catch (error) {

    feed.innerHTML = `
      <div class="card empty">
        Не удалось загрузить ленту.<br><br>
        <small>
          ${escapeHtml(
            error.message
          )}
        </small>
      </div>
    `;

  }
}


function renderPosts(posts) {

  const feed =
    document.getElementById(
      'feed'
    );


  if (!posts.length) {

    feed.innerHTML = `
      <div class="card empty">
        Пока здесь пусто.<br>
        Напиши первый пост!
      </div>
    `;

    return;
  }


  feed.innerHTML =
    posts
      .map(postHtml)
      .join('');
}


/* =========================================================
   POST HTML
========================================================= */

function postHtml(post) {

  const user =
    post.user || {};


  return `
    <article
      class="card"
      id="post-${post.id}"
    >

      <div class="post-head">

        ${avatarHtml(user)}

        <div class="post-user">

          <div class="post-name">
            ${escapeHtml(
              user.name || 'Пользователь'
            )}
          </div>

          <div class="post-handle">
            ${escapeHtml(
              user.handle ||
              '@' +
                (user.username || '')
            )}
          </div>

        </div>

        <div class="post-date">
          ${formatDate(
            post.createdAt
          )}
        </div>

      </div>


      ${
        post.text
          ? `
            <div class="post-text">
              ${escapeHtml(
                post.text
              )}
            </div>
          `
          : ''
      }


      ${
        post.media
          ? `
            <img
              class="post-image"
              src="${escapeHtml(
                mediaUrl(post.media)
              )}"
              alt=""
              loading="lazy"
            >
          `
          : ''
      }


      <div class="post-actions">

        <button
          class="${
            post.liked
              ? 'liked'
              : ''
          }"
          onclick="toggleLike(${post.id})"
        >
          ❤️ ${post.likes || 0}
        </button>


        <button
          onclick="toggleComments(${post.id})"
        >
          💬 ${post.comments || 0}
        </button>


        <button
          onclick="showToast('Репосты скоро появятся')"
        >
          🔁 ${post.reposts || 0}
        </button>

      </div>


      <div
        id="comments-${post.id}"
        class="comments-box hidden"
      ></div>

    </article>
  `;
}


/* =========================================================
   CREATE POST
========================================================= */

async function createPost() {

  const text =
    document
      .getElementById(
        'postText'
      )
      .value
      .trim();


  const file =
    document
      .getElementById(
        'postPhoto'
      )
      .files[0];


  if (!text && !file) {

    showToast(
      'Добавь текст или фото'
    );

    return;
  }


  const button =
    document.getElementById(
      'publishBtn'
    );


  button.disabled = true;

  button.textContent =
    'Публикуем...';


  try {

    const form =
      new FormData();


    form.append(
      'text',
      text
    );


    if (file) {

      form.append(
        'photo',
        file
      );

    }


    await api(
      '/api/posts',
      {
        method: 'POST',
        body: form
      }
    );


    document
      .getElementById(
        'postText'
      )
      .value = '';


    document
      .getElementById(
        'postPhoto'
      )
      .value = '';


    document
      .getElementById(
        'selectedPhoto'
      )
      .textContent = '';


    await loadFeed();


    showToast(
      'Пост опубликован!'
    );


  } catch (error) {

    showToast(
      error.message
    );


  } finally {

    button.disabled = false;

    button.textContent =
      'Апублікаваць';

  }
}

/* =========================================================
   COMMENTS
========================================================= */

async function toggleComments(
  postId
) {

  const box =
    document.getElementById(
      `comments-${postId}`
    );


  if (!box) {
    return;
  }


  if (
    !box.classList.contains(
      'hidden'
    )
  ) {

    box.classList.add(
      'hidden'
    );

    return;

  }


  box.classList.remove(
    'hidden'
  );


  await loadComments(
    postId
  );
}


async function loadComments(
  postId
) {

  const box =
    document.getElementById(
      `comments-${postId}`
    );


  if (!box) {
    return;
  }


  box.innerHTML = `
    <div class="muted">
      Загружаем комментарии...
    </div>
  `;


  try {

    const data =
      await api(
        `/api/posts/${postId}/comments`
      );


    const comments =
      data.comments || [];


    let html = '';


    if (!comments.length) {

      html += `
        <div
          class="muted"
          style="padding:8px 0"
        >
          Пока нет комментариев.
        </div>
      `;

    } else {

      html += comments
        .map(
          comment => {

            const canDelete =
              currentUser &&
              comment.user &&
              currentUser.id ===
                comment.user.id;


            return `
              <div class="comment">

                ${avatarHtml(
                  comment.user,
                  'avatar'
                )}

                <div class="comment-content">

                  <div>
                    <span class="comment-author">
                      ${escapeHtml(
                        comment.user?.name ||
                        'Пользователь'
                      )}
                    </span>
                  </div>

                  <div class="comment-text">
                    ${escapeHtml(
                      comment.text
                    )}
                  </div>

                  <div class="comment-date">
                    ${formatDate(
                      comment.createdAt
                    )}
                  </div>

                </div>

                ${
                  canDelete
                    ? `
                      <button
                        class="comment-delete"
                        onclick="deleteComment(${comment.id}, ${postId})"
                      >
                        Удалить
                      </button>
                    `
                    : ''
                }

              </div>
            `;
          }
        )
        .join('');

    }


    html += `
      <form
        class="comment-form"
        onsubmit="submitComment(event, ${postId})"
      >

        <input
          id="comment-input-${postId}"
          maxlength="500"
          placeholder="Написать комментарий..."
          required
        >

        <button type="submit">
          Отправить
        </button>

      </form>
    `;


    box.innerHTML =
      html;


  } catch (error) {

    box.innerHTML = `
      <div class="muted">
        Не удалось загрузить комментарии.<br>
        ${escapeHtml(
          error.message
        )}
      </div>
    `;

  }
}


async function submitComment(
  event,
  postId
) {

  event.preventDefault();


  const input =
    document.getElementById(
      `comment-input-${postId}`
    );


  if (!input) {
    return;
  }


  const text =
    input.value.trim();


  if (!text) {
    return;
  }


  input.disabled = true;


  try {

    await api(
      `/api/posts/${postId}/comments`,
      {
        method: 'POST',

        headers: {
          'Content-Type':
            'application/json'
        },

        body:
          JSON.stringify({
            text
          })
      }
    );


    await loadComments(
      postId
    );


    await loadFeed();


    const box =
      document.getElementById(
        `comments-${postId}`
      );


    if (box) {

      box.classList.remove(
        'hidden'
      );

      await loadComments(
        postId
      );

    }


  } catch (error) {

    showToast(
      error.message
    );

    input.disabled = false;

  }
}


async function deleteComment(
  commentId,
  postId
) {

  if (
    !confirm(
      'Удалить комментарий?'
    )
  ) {
    return;
  }


  try {

    await api(
      `/api/comments/${commentId}`,
      {
        method: 'DELETE'
      }
    );


    await loadFeed();


    const box =
      document.getElementById(
        `comments-${postId}`
      );


    if (box) {

      box.classList.remove(
        'hidden'
      );

      await loadComments(
        postId
      );

    }


  } catch (error) {

    showToast(
      error.message
    );

  }
}


/* =========================================================
   SEARCH
========================================================= */

let searchTimer = null;


document
  .getElementById(
    'searchInput'
  )
  .addEventListener(
    'input',
    event => {

      clearTimeout(
        searchTimer
      );


      const q =
        event.target.value.trim();


      searchTimer =
        setTimeout(
          () => search(q),
          300
        );

    }
  );


async function search(q) {

  const results =
    document.getElementById(
      'searchResults'
    );


  if (!q) {

    results.innerHTML =
      '';

    return;

  }


  results.innerHTML = `
    <div class="card empty">
      Ищем...
    </div>
  `;


  try {

    const data =
      await api(
        '/api/search?q=' +
        encodeURIComponent(q)
      );


    let html = '';


    if (
      data.users &&
      data.users.length
    ) {

      html += `
        <div class="card">

          <strong>
            Люди
          </strong>
      `;


      data.users.forEach(
        user => {

          html += `
            <div
              class="result"
              style="cursor:pointer"
              onclick="loadProfileByUsername('${escapeJs(
                user.username
              )}')"
            >

              <div class="result-user">

                ${avatarHtml(
                  user
                )}

                <div>

                  <strong>
                    ${escapeHtml(
                      user.name
                    )}
                  </strong>

                  <div class="muted">
                    ${escapeHtml(
                      user.handle
                    )}
                  </div>

                </div>

              </div>

            </div>
          `;

        }
      );


      html += `
        </div>
      `;

    }


    if (
      data.posts &&
      data.posts.length
    ) {

      html += `
        <div>
          ${data.posts
            .map(postHtml)
            .join('')}
        </div>
      `;

    }


    if (!html) {

      html = `
        <div class="card empty">
          Ничего не найдено.
        </div>
      `;

    }


    results.innerHTML =
      html;


  } catch (error) {

    results.innerHTML = `
      <div class="card empty">
        Ошибка поиска:<br><br>
        ${escapeHtml(
          error.message
        )}
      </div>
    `;

  }
}


function escapeJs(value) {

  return String(
    value ?? ''
  )
    .replaceAll(
      '\\',
      '\\\\'
    )
    .replaceAll(
      "'",
      "\\'"
    )
    .replaceAll(
      '"',
      '\\"'
    )
    .replaceAll(
      '\n',
      '\\n'
    )
    .replaceAll(
      '\r',
      '\\r'
    );
}

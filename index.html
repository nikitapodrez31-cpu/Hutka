<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101820">
<title>Hutka</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #f5f1e8;
  --card: #fffdf8;
  --text: #182027;
  --muted: #70777c;
  --border: #ddd6c9;
  --accent: #b3262e;
  --accent-dark: #8e1c23;
  --green: #2e7654;
  --shadow: 0 10px 35px rgba(0,0,0,.10);
}

body.dark {
  --bg: #101820;
  --card: #18232c;
  --text: #f2f3f4;
  --muted: #aab2b8;
  --border: #34414b;
  --accent: #df4b54;
  --accent-dark: #bd343d;
  --green: #4e9b75;
  --shadow: 0 10px 35px rgba(0,0,0,.35);
}

body {
  min-height: 100vh;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:
    radial-gradient(circle at 20% 10%, rgba(179,38,46,.06), transparent 30%),
    radial-gradient(circle at 80% 90%, rgba(46,118,84,.06), transparent 30%),
    var(--bg);
  color: var(--text);
  transition: .25s ease;
}

/* Белорусский орнамент */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .055;
  background-image:
    linear-gradient(45deg, var(--accent) 25%, transparent 25%),
    linear-gradient(-45deg, var(--accent) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, var(--green) 75%),
    linear-gradient(-45deg, transparent 75%, var(--green) 75%);
  background-size: 42px 42px;
  background-position:
    0 0,
    0 21px,
    21px -21px,
    -21px 0;
  z-index: 0;
}

/* Аист */
.stork {
  position: fixed;
  right: 25px;
  top: 80px;
  width: 110px;
  height: 150px;
  pointer-events: none;
  z-index: 0;
  opacity: .13;
}

.stork-body {
  position: absolute;
  width: 55px;
  height: 85px;
  border-radius: 50% 50% 45% 45%;
  background: white;
  border: 3px solid var(--text);
  transform: rotate(-8deg);
  left: 30px;
  top: 38px;
}

.stork-head {
  position: absolute;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: white;
  border: 3px solid var(--text);
  left: 25px;
  top: 5px;
}

.stork-head::after {
  content: "";
  position: absolute;
  width: 42px;
  height: 7px;
  background: var(--accent);
  left: 30px;
  top: 15px;
  transform: rotate(-5deg);
  transform-origin: left center;
}

.stork-eye {
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--text);
  left: 28px;
  top: 13px;
}

.stork-leg {
  position: absolute;
  width: 3px;
  height: 55px;
  background: var(--accent);
  bottom: 3px;
}

.stork-leg.one {
  left: 48px;
  transform: rotate(7deg);
}

.stork-leg.two {
  left: 68px;
  transform: rotate(-5deg);
}

.stork-wing {
  position: absolute;
  width: 55px;
  height: 45px;
  border-radius: 50%;
  background: #f7f7f7;
  border: 3px solid var(--text);
  left: 7px;
  top: 48px;
  transform: rotate(25deg);
}

/* Общие */
.hidden {
  display: none !important;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.container {
  width: min(1100px, calc(100% - 30px));
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

/* Auth */
.auth-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px 15px;
  position: relative;
  z-index: 2;
}

.auth-card {
  width: min(430px, 100%);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 25px;
  padding: 35px;
  box-shadow: var(--shadow);
}

.logo {
  text-align: center;
  margin-bottom: 25px;
}

.logo h1 {
  font-size: 46px;
  letter-spacing: -2px;
  color: var(--accent);
}

.logo p {
  color: var(--muted);
  margin-top: 4px;
}

.auth-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-bottom: 22px;
}

.auth-tab {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  padding: 11px;
  border-radius: 12px;
}

.auth-tab.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.form-group {
  margin-bottom: 15px;
}

.form-group label {
  display: block;
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 6px;
}

.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  border-radius: 12px;
  padding: 13px 14px;
  outline: none;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
  border-color: var(--accent);
}

.primary-btn {
  width: 100%;
  border: none;
  border-radius: 13px;
  padding: 14px;
  color: white;
  background: var(--accent);
  font-weight: 700;
  transition: .2s;
}

.primary-btn:hover {
  background: var(--accent-dark);
  transform: translateY(-1px);
}

.secondary-btn {
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 9px 13px;
  background: transparent;
  color: var(--text);
}

.auth-message {
  min-height: 22px;
  text-align: center;
  color: var(--accent);
  font-size: 14px;
  margin-top: 12px;
}

/* App */
.app-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: color-mix(in srgb, var(--card) 94%, transparent);
  backdrop-filter: blur(15px);
  border-bottom: 1px solid var(--border);
}

.header-inner {
  min-height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.header-logo {
  font-weight: 900;
  font-size: 28px;
  color: var(--accent);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 7px;
}

.icon-btn {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  border-radius: 11px;
  min-width: 42px;
  height: 42px;
  padding: 0 11px;
}

.main-layout {
  width: min(900px, calc(100% - 30px));
  margin: 25px auto 80px;
  position: relative;
  z-index: 1;
}

.create-post {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 18px;
  box-shadow: var(--shadow);
  margin-bottom: 18px;
}

.create-post textarea {
  width: 100%;
  min-height: 90px;
  resize: vertical;
  border: none;
  outline: none;
  background: transparent;
  color: var(--text);
  font-size: 16px;
}

.create-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border-top: 1px solid var(--border);
  padding-top: 12px;
}

.feed {
  display: grid;
  gap: 18px;
}

.post {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  box-shadow: var(--shadow);
}

.post-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--accent);
  color: white;
  font-weight: 800;
}

.username {
  font-weight: 750;
}

.post-date {
  color: var(--muted);
  font-size: 12px;
}

.post-text {
  line-height: 1.55;
  white-space: pre-wrap;
  margin-bottom: 16px;
}

.post-actions {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  border-top: 1px solid var(--border);
  padding-top: 12px;
}

.action-btn {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  border-radius: 10px;
  padding: 8px 12px;
}

.action-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.comments {
  margin-top: 14px;
  border-top: 1px solid var(--border);
  padding-top: 14px;
}

.comment {
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
}

.comment strong {
  margin-right: 6px;
}

.comment-form {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.comment-form input {
  min-width: 0;
  flex: 1;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  color: var(--text);
  padding: 10px;
}

.comment-form button {
  border: none;
  border-radius: 10px;
  background: var(--accent);
  color: white;
  padding: 0 14px;
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 45px 20px;
  background: var(--card);
  border: 1px dashed var(--border);
  border-radius: 18px;
}

/* Settings */
.settings {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 18px;
}

.settings h2 {
  margin-bottom: 18px;
}

.setting-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}

.setting-row:last-child {
  border-bottom: none;
}

.setting-title {
  font-weight: 700;
}

.setting-description {
  color: var(--muted);
  font-size: 13px;
  margin-top: 3px;
}

/* Mobile */
@media (max-width: 650px) {
  .stork {
    right: -20px;
    top: 75px;
    transform: scale(.7);
    transform-origin: top right;
  }

  .auth-card {
    padding: 25px 20px;
  }

  .header-logo {
    font-size: 24px;
  }

  .main-layout {
    width: min(100% - 18px, 900px);
    margin-top: 15px;
  }

  .post {
    padding: 16px;
  }

  .header-inner {
    padding: 0 9px;
  }
}
</style>
</head>

<body>

<!-- Аист -->
<div class="stork" aria-hidden="true">
  <div class="stork-head">
    <span class="stork-eye"></span>
  </div>
  <div class="stork-body"></div>
  <div class="stork-wing"></div>
  <div class="stork-leg one"></div>
  <div class="stork-leg two"></div>
</div>

<!-- AUTH -->
<div id="authScreen" class="auth-screen">

  <div class="auth-card">

    <div class="logo">
      <h1>Hutka</h1>
      <p id="authSubtitle">Беларуская сацыяльная сетка</p>
    </div>

    <div class="auth-tabs">
      <button
        id="loginTab"
        class="auth-tab active"
        type="button"
        onclick="switchAuth('login')">
        Увайсці
      </button>

      <button
        id="registerTab"
        class="auth-tab"
        type="button"
        onclick="switchAuth('register')">
        Рэгістрацыя
      </button>
    </div>

    <form id="authForm">

      <div class="form-group">
        <label id="usernameLabel">Username</label>
        <input
          id="username"
          type="text"
          autocomplete="username"
          required
          maxlength="30">
      </div>

      <div class="form-group">
        <label id="passwordLabel">Пароль</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
          minlength="4">
      </div>

      <div
        id="confirmPasswordGroup"
        class="form-group hidden">

        <label id="confirmPasswordLabel">
          Повторите пароль
        </label>

        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="4">
      </div>

      <button
        id="authButton"
        class="primary-btn"
        type="submit">
        Увайсці
      </button>

      <div
        id="authMessage"
        class="auth-message">
      </div>

    </form>

  </div>
</div>


<!-- MAIN APP -->
<div id="mainApp" class="hidden">

  <header class="app-header">

    <div class="container header-inner">

      <div class="header-logo">
        Hutka
      </div>

      <div class="header-actions">

        <button
          class="icon-btn"
          type="button"
          onclick="toggleTheme()"
          title="Тема">
          🌓
        </button>

        <button
          class="icon-btn"
          type="button"
          onclick="showSettings()"
          title="Настройки">
          ⚙️
        </button>

        <button
          class="icon-btn"
          type="button"
          onclick="logout()"
          title="Выйти">
          ↪
        </button>

      </div>

    </div>
  </header>


  <main class="main-layout">

    <!-- SETTINGS -->
    <section
      id="settingsPanel"
      class="settings hidden">

      <h2 id="settingsTitle">
        Настройки
      </h2>

      <div class="setting-row">

        <div>
          <div
            class="setting-title"
            id="themeTitle">
            Тема
          </div>

          <div
            class="setting-description"
            id="themeDescription">
            Светлая или тёмная тема
          </div>
        </div>

        <select
          id="themeSelect"
          onchange="changeTheme(this.value)">
          <option value="light">☀️ Светлая</option>
          <option value="dark">🌙 Тёмная</option>
        </select>

      </div>


      <div class="setting-row">

        <div>
          <div
            class="setting-title"
            id="languageTitle">
            Язык
          </div>

          <div
            class="setting-description"
            id="languageDescription">
            Язык интерфейса
          </div>
        </div>

        <select
          id="languageSelect"
          onchange="changeLanguage(this.value)">
          <option value="ru">Русский</option>
          <option value="by">Беларуская</option>
          <option value="en">English</option>
        </select>

      </div>

    </section>


    <!-- CREATE POST -->
    <section class="create-post">

      <textarea
        id="postText"
        maxlength="5000"
        placeholder="Што ў вас новага?">
      </textarea>

      <div class="create-bottom">

        <span
          id="postHint"
          style="color:var(--muted);font-size:13px;">
          Раскажыце нешта сябрам
        </span>

        <button
          class="primary-btn"
          style="width:auto;padding:10px 18px;"
          type="button"
          onclick="createPost()"
          id="publishButton">
          Апублікаваць
        </button>

      </div>

    </section>


    <!-- FEED -->
    <section id="feed" class="feed">

      <div class="empty">
        Загрузка Hutka…
      </div>

    </section>

  </main>

</div>


<script>
/*
 * ============================================
 * HUTKA FRONTEND
 * ============================================
 *
 * ВАЖНО:
 * Если твой Render API находится по другому адресу,
 * измени только API_BASE ниже.
 *
 * Например:
 * const API_BASE = 'https://hutka-api.onrender.com';
 *
 */

const API_BASE = 'https://hutka-server.onrender.com';;

let currentUser = null;
let currentAuthMode = 'login';
let currentLanguage = localStorage.getItem('hutka_language') || 'ru';
let currentTheme = localStorage.getItem('hutka_theme') || 'light';


/* ============================================
   ПЕРЕВОДЫ
============================================ */

const translations = {

  ru: {
    subtitle: 'Белорусская социальная сеть',
    login: 'Войти',
    register: 'Регистрация',
    password: 'Пароль',
    confirmPassword: 'Повторите пароль',
    loginButton: 'Войти',
    registerButton: 'Зарегистрироваться',
    postPlaceholder: 'Что у вас нового?',
    postHint: 'Расскажите что-нибудь друзьям',
    publish: 'Опубликовать',
    settings: 'Настройки',
    theme: 'Тема',
    themeDescription: 'Светлая или тёмная тема',
    language: 'Язык',
    languageDescription: 'Язык интерфейса',
    light: '☀️ Светлая',
    dark: '🌙 Тёмная',
    comments: 'Комментарии',
    commentPlaceholder: 'Написать комментарий…',
    send: 'Отправить',
    repost: 'Репост',
    like: 'Нравится',
    noPosts: 'Пока нет публикаций.',
    loading: 'Загрузка Hutka…',
    wrongPassword: 'Пароли не совпадают.',
    emptyPost: 'Напишите что-нибудь.',
    serverError: 'Сервер временно недоступен.',
    logout: 'Выйти'
  },

  by: {
    subtitle: 'Беларуская сацыяльная сетка',
    login: 'Увайсці',
    register: 'Рэгістрацыя',
    password: 'Пароль',
    confirmPassword: 'Паўтарыце пароль',
    loginButton: 'Увайсці',
    registerButton: 'Зарэгістравацца',
    postPlaceholder: 'Што ў вас новага?',
    postHint: 'Раскажыце нешта сябрам',
    publish: 'Апублікаваць',
    settings: 'Налады',
    theme: 'Тэма',
    themeDescription: 'Светлая або цёмная тэма',
    language: 'Мова',
    languageDescription: 'Мова інтэрфейсу',
    light: '☀️ Светлая',
    dark: '🌙 Цёмная',
    comments: 'Каментарыі',
    commentPlaceholder: 'Напісаць каментарый…',
    send: 'Адправіць',
    repost: 'Рэпост',
    like: 'Падабаецца',
    noPosts: 'Пакуль няма публікацый.',
    loading: 'Загрузка Hutka…',
    wrongPassword: 'Паролі не супадаюць.',
    emptyPost: 'Напішыце нешта.',
    serverError: 'Сервер часова недаступны.',
    logout: 'Выйсці'
  },

  en: {
    subtitle: 'Belarusian social network',
    login: 'Login',
    register: 'Registration',
    password: 'Password',
    confirmPassword: 'Confirm password',
    loginButton: 'Login',
    registerButton: 'Register',
    postPlaceholder: 'What is new?',
    postHint: 'Share something with your friends',
    publish: 'Publish',
    settings: 'Settings',
    theme: 'Theme',
    themeDescription: 'Light or dark theme',
    language: 'Language',
    languageDescription: 'Interface language',
    light: '☀️ Light',
    dark: '🌙 Dark',
    comments: 'Comments',
    commentPlaceholder: 'Write a comment…',
    send: 'Send',
    repost: 'Repost',
    like: 'Like',
    noPosts: 'No posts yet.',
    loading: 'Loading Hutka…',
    wrongPassword: 'Passwords do not match.',
    emptyPost: 'Write something.',
    serverError: 'Server is temporarily unavailable.',
    logout: 'Logout'
  }

};


/* ============================================
   HELPERS
============================================ */

function t(key) {
  return translations[currentLanguage]?.[key]
    || translations.ru[key]
    || key;
}


function escapeHTML(value) {

  if (value === null || value === undefined) {
    return '';
  }

  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}


function getInitial(username) {

  if (!username) {
    return 'H';
  }

  return String(username)
    .trim()
    .charAt(0)
    .toUpperCase();
}


function getPostId(post) {

  return post.id
    ?? post._id
    ?? post.postId
    ?? '';
}


function getUsername(post) {

  return post.username
    ?? post.user?.username
    ?? post.author?.username
    ?? 'Hutka';
}


/* ============================================
   THEME
============================================ */

function applyTheme() {

  document.body.classList.toggle(
    'dark',
    currentTheme === 'dark'
  );

  const select = document.getElementById('themeSelect');

  if (select) {
    select.value = currentTheme;
  }
}


function toggleTheme() {

  currentTheme =
    currentTheme === 'dark'
      ? 'light'
      : 'dark';

  localStorage.setItem(
    'hutka_theme',
    currentTheme
  );

  applyTheme();
}


function changeTheme(theme) {

  if (theme !== 'dark' && theme !== 'light') {
    return;
  }

  currentTheme = theme;

  localStorage.setItem(
    'hutka_theme',
    theme
  );

  applyTheme();
}


/* ============================================
   LANGUAGE
============================================ */

function changeLanguage(language) {

  if (!translations[language]) {
    return;
  }

  currentLanguage = language;

  localStorage.setItem(
    'hutka_language',
    language
  );

  applyTranslations();

  if (currentUser) {
    loadFeed();
  }
}


function applyTranslations() {

  const languageSelect =
    document.getElementById('languageSelect');

  if (languageSelect) {
    languageSelect.value = currentLanguage;
  }

  document.getElementById('authSubtitle').textContent =
    t('subtitle');

  document.getElementById('loginTab').textContent =
    t('login');

  document.getElementById('registerTab').textContent =
    t('register');

  document.getElementById('passwordLabel').textContent =
    t('password');

  document.getElementById('confirmPasswordLabel').textContent =
    t('confirmPassword');

  document.getElementById('authButton').textContent =
    currentAuthMode === 'login'
      ? t('loginButton')
      : t('registerButton');

  document.getElementById('postText').placeholder =
    t('postPlaceholder');

  document.getElementById('postHint').textContent =
    t('postHint');

  document.getElementById('publishButton').textContent =
    t('publish');

  document.getElementById('settingsTitle').textContent =
    t('settings');

  document.getElementById('themeTitle').textContent =
    t('theme');

  document.getElementById('themeDescription').textContent =
    t('themeDescription');

  document.getElementById('languageTitle').textContent =
    t('language');

  document.getElementById('languageDescription').textContent =
    t('languageDescription');

  const lightOption =
    document.querySelector(
      '#themeSelect option[value="light"]'
    );

  const darkOption =
    document.querySelector(
      '#themeSelect option[value="dark"]'
    );

  if (lightOption) {
    lightOption.textContent = t('light');
  }

  if (darkOption) {
    darkOption.textContent = t('dark');
  }
}


/* ============================================
   AUTH UI
============================================ */

function switchAuth(mode) {

  currentAuthMode = mode;

  const loginTab =
    document.getElementById('loginTab');

  const registerTab =
    document.getElementById('registerTab');

  const confirmGroup =
    document.getElementById('confirmPasswordGroup');

  const button =
    document.getElementById('authButton');

  document.getElementById('authMessage').textContent = '';

  if (mode === 'login') {

    loginTab.classList.add('active');
    registerTab.classList.remove('active');

    confirmGroup.classList.add('hidden');

    button.textContent =
      t('loginButton');

  } else {

    loginTab.classList.remove('active');
    registerTab.classList.add('active');

    confirmGroup.classList.remove('hidden');

    button.textContent =
      t('registerButton');
  }
}


/* ============================================
   API
============================================ */

async function apiRequest(
  path,
  options = {}
) {

  const config = {
    credentials: 'include',
    headers: {
      'Content-Type': 'application/json',
      ...(options.headers || {})
    },
    ...options
  };

  const response =
    await fetch(
      API_BASE + path,
      config
    );

  let data = null;

  try {
    data = await response.json();
  } catch {
    data = null;
  }

  if (!response.ok) {

    const message =
      data?.message
      || data?.error
      || `HTTP ${response.status}`;

    throw new Error(message);
  }

  return data;
}


/* ============================================
   AUTH CHECK
============================================ */

async function checkAuth() {

  try {

    const data =
      await apiRequest('/api/me');

    if (
      data &&
      (
        data.user ||
        data.username ||
        data.authenticated === true
      )
    ) {

      currentUser =
        data.user
        || data;

      showMain();

      await loadFeed();

      return;
    }

  } catch (error) {

    console.warn(
      'Auth check failed:',
      error
    );
  }

  showAuth();
}


/* ============================================
   SHOW AUTH
============================================ */

function showAuth() {

  document
    .getElementById('authScreen')
    .classList.remove('hidden');

  document
    .getElementById('mainApp')
    .classList.add('hidden');
}


/* ============================================
   SHOW MAIN
============================================ */

function showMain() {

  document
    .getElementById('authScreen')
    .classList.add('hidden');

  document
    .getElementById('mainApp')
    .classList.remove('hidden');
}


/* ============================================
   LOGIN / REGISTER
============================================ */

document
  .getElementById('authForm')
  .addEventListener(
    'submit',
    async function(event) {

      event.preventDefault();

      const username =
        document
          .getElementById('username')
          .value
          .trim();

      const password =
        document
          .getElementById('password')
          .value;

      const confirmPassword =
        document
          .getElementById('confirmPassword')
          .value;

      const message =
        document.getElementById(
          'authMessage'
        );

      message.textContent = '';

      if (!username || !password) {
        message.textContent =
          'Заполните все поля.';
        return;
      }

      if (
        currentAuthMode === 'register'
        && password !== confirmPassword
      ) {

        message.textContent =
          t('wrongPassword');

        return;
      }

      const button =
        document.getElementById(
          'authButton'
        );

      button.disabled = true;

      try {

        const endpoint =
          currentAuthMode === 'login'
            ? '/api/login'
            : '/api/register';

        const data =
          await apiRequest(
            endpoint,
            {
              method: 'POST',
              body: JSON.stringify({
                username,
                password
              })
            }
          );

        currentUser =
          data?.user
          || data;

        showMain();

        document.getElementById(
          'authForm'
        ).reset();

        await loadFeed();

      } catch (error) {

        console.error(
          'AUTH ERROR:',
          error
        );

        message.textContent =
          error.message
          || t('serverError');

      } finally {

        button.disabled = false;
      }

    }
  );


/* ============================================
   LOGOUT
============================================ */

async function logout() {

  try {

    await apiRequest(
      '/api/logout',
      {
        method: 'POST'
      }
    );

  } catch (error) {

    console.warn(
      'Logout error:',
      error
    );

  } finally {

    currentUser = null;

    showAuth();

    switchAuth('login');
  }
}


/* ============================================
   FEED
============================================ */

async function loadFeed() {

  const feed =
    document.getElementById('feed');

  feed.innerHTML =
    `<div class="empty">${escapeHTML(t('loading'))}</div>`;

  try {

    const data =
      await apiRequest('/api/posts');

    let posts =
      Array.isArray(data)
        ? data
        : (
            data?.posts
            || data?.items
            || []
          );

    if (!Array.isArray(posts)) {
      posts = [];
    }

    renderPosts(posts);

  } catch (error) {

    console.error(
      'FEED ERROR:',
      error
    );

    /*
     * Даже если API временно недоступен,
     * сам интерфейс продолжает работать.
     */

    feed.innerHTML = `
      <div class="empty">
        ${escapeHTML(t('serverError'))}
        <br><br>
        <button
          class="secondary-btn"
          onclick="loadFeed()">
          ↻ Повторить
        </button>
      </div>
    `;
  }
}


/* ============================================
   RENDER POSTS
============================================ */

function renderPosts(posts) {

  const feed =
    document.getElementById('feed');

  if (!posts.length) {

    feed.innerHTML =
      `<div class="empty">${escapeHTML(t('noPosts'))}</div>`;

    return;
  }

  feed.innerHTML =
    posts
      .map(post => renderPost(post))
      .join('');
}


function renderPost(post) {

  const id =
    getPostId(post);

  const username =
    getUsername(post);

  const text =
    post.text
    ?? post.content
    ?? post.body
    ?? '';

  const date =
    post.createdAt
    ?? post.created_at
    ?? post.date
    ?? '';

  const likes =
    Number(post.likesCount ?? post.likes ?? 0);

  const reposts =
    Number(
      post.repostsCount
      ?? post.reposts
      ?? 0
    );

  const comments =
    Array.isArray(post.comments)
      ? post.comments
      : [];

  return `
    <article
      class="post"
      data-post-id="${escapeHTML(id)}">

      <div class="post-header">

        <div class="user-info">

          <div class="avatar">
            ${escapeHTML(getInitial(username))}
          </div>

          <div>

            <div class="username">
              @${escapeHTML(username)}
            </div>

            <div class="post-date">
              ${escapeHTML(formatDate(date))}
            </div>

          </div>

        </div>

      </div>


      <div class="post-text">
        ${escapeHTML(text)}
      </div>


      <div class="post-actions">

        <button
          class="action-btn"
          onclick="likePost('${escapeHTML(id)}')">
          ❤️ ${likes}
        </button>

        <button
          class="action-btn"
          onclick="toggleComments('${escapeHTML(id)}')">
          💬 ${t('comments')}
        </button>

        <button
          class="action-btn"
          onclick="repostPost('${escapeHTML(id)}')">
          🔁 ${t('repost')} ${reposts}
        </button>

      </div>


      <div
        id="comments-${escapeHTML(id)}"
        class="comments hidden">

        <div class="comments-list">

          ${
            comments
              .map(comment =>
                renderComment(comment)
              )
              .join('')
          }

        </div>

        <form
          class="comment-form"
          onsubmit="submitComment(event, '${escapeHTML(id)}')">

          <input
            id="comment-input-${escapeHTML(id)}"
            type="text"
            maxlength="1000"
            placeholder="${escapeHTML(t('commentPlaceholder'))}"
            required>

          <button type="submit">
            ${escapeHTML(t('send'))}
          </button>

        </form>

      </div>

    </article>
  `;
}


function renderComment(comment) {

  const username =
    comment.username
    ?? comment.user?.username
    ?? comment.author?.username
    ?? 'Hutka';

  const text =
    comment.text
    ?? comment.content
    ?? '';

  return `
    <div class="comment">
      <strong>
        @${escapeHTML(username)}
      </strong>
      ${escapeHTML(text)}
    </div>
  `;
}


function formatDate(value) {

  if (!value) {
    return '';
  }

  try {

    const date =
      new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return '';
    }

    return date.toLocaleString(
      currentLanguage === 'en'
        ? 'en-US'
        : currentLanguage === 'by'
          ? 'be-BY'
          : 'ru-RU',
      {
        dateStyle: 'short',
        timeStyle: 'short'
      }
    );

  } catch {

    return '';
  }
}


/* ============================================
   CREATE POST
============================================ */

async function createPost() {

  const textarea =
    document.getElementById(
      'postText'
    );

  const text =
    textarea.value.trim();

  if (!text) {

    alert(
      t('emptyPost')
    );

    return;
  }

  const button =
    document.getElementById(
      'publishButton'
    );

  button.disabled = true;

  try {

    await apiRequest(
      '/api/posts',
      {
        method: 'POST',
        body: JSON.stringify({
          text
        })
      }
    );

    textarea.value = '';

    await loadFeed();

  } catch (error) {

    console.error(
      'CREATE POST ERROR:',
      error
    );

    alert(
      error.message
      || t('serverError')
    );

  } finally {

    button.disabled = false;
  }
}


/* ============================================
   LIKE
============================================ */

async function likePost(id) {

  if (!id) {
    return;
  }

  try {

    await apiRequest(
      `/api/posts/${encodeURIComponent(id)}/like`,
      {
        method: 'POST'
      }
    );

    await loadFeed();

  } catch (error) {

    console.error(
      'LIKE ERROR:',
      error
    );

    alert(
      error.message
      || t('serverError')
    );
  }
}

/* ============================================
   COMMENTS
============================================ */

function toggleComments(id) {

  const box =
    document.getElementById(
      `comments-${id}`
    );

  if (!box) {
    return;
  }

  box.classList.toggle('hidden');
}


async function submitComment(
  event,
  postId
) {

  event.preventDefault();

  const input =
    document.getElementById(
      `comment-input-${postId}`
    );

  if (!input) {
    return;
  }

  const text =
    input.value.trim();

  if (!text) {
    return;
  }

  try {

    await apiRequest(
      `/api/posts/${encodeURIComponent(postId)}/comments`,
      {
        method: 'POST',
        body: JSON.stringify({
          text
        })
      }
    );

    input.value = '';

    await loadFeed();

    setTimeout(
      () => toggleComments(postId),
      50
    );

  } catch (error) {

    console.error(
      'COMMENT ERROR:',
      error
    );

    alert(
      error.message
      || t('serverError')
    );
  }
}

   SETTINGS
============================================ */

function showSettings() {

  const panel =
    document.getElementById(
      'settingsPanel'
    );

  panel.classList.toggle(
    'hidden'
  );
}

applyTheme();

applyTranslations();

switchAuth('login');

 * КЛЮЧЕВАЯ ЗАЩИТА ОТ ПУСТОГО ЭКРАНА.

window.addEventListener(

  () => {

    checkAuth().catch(
      error => {

        console.error(
          'HUTKA START ERROR:',

        );

        showAuth();
      }
    );

  }
);

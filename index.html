<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8b1e2d">
<title>Hutka</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #f4efe5;
  --card: #fffdf8;
  --text: #202326;
  --muted: #73777b;
  --border: #ded7ca;
  --accent: #a51f2d;
  --accent-hover: #861823;
  --green: #367957;
  --danger: #c62828;
  --shadow: 0 10px 35px rgba(0,0,0,.09);
}

body.dark {
  --bg: #101820;
  --card: #19242c;
  --text: #f4f5f5;
  --muted: #a9b1b6;
  --border: #35434c;
  --accent: #d84654;
  --accent-hover: #bd3542;
  --green: #55a379;
  --shadow: 0 10px 35px rgba(0,0,0,.35);
}

html {
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:
    radial-gradient(
      circle at 10% 10%,
      rgba(165,31,45,.07),
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 90%,
      rgba(54,121,87,.07),
      transparent 30%
    ),
    var(--bg);
  color: var(--text);
  transition: background .25s, color .25s;
}

/* =========================================================
   ОРНАМЕНТ
========================================================= */

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: .045;

  background-image:
    linear-gradient(45deg, var(--accent) 25%, transparent 25%),
    linear-gradient(-45deg, var(--accent) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, var(--green) 75%),
    linear-gradient(-45deg, transparent 75%, var(--green) 75%);

  background-size: 44px 44px;

  background-position:
    0 0,
    0 22px,
    22px -22px,
    -22px 0;
}

/* =========================================================
   АИСТ
========================================================= */

.stork {
  position: fixed;
  right: 25px;
  top: 80px;
  width: 120px;
  height: 160px;
  opacity: .12;
  pointer-events: none;
  z-index: 0;
}

.stork-head {
  position: absolute;
  left: 30px;
  top: 8px;
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: white;
  border: 3px solid var(--text);
}

.stork-head::after {
  content: "";
  position: absolute;
  left: 35px;
  top: 16px;
  width: 48px;
  height: 7px;
  background: var(--accent);
  transform: rotate(-5deg);
  transform-origin: left center;
}

.stork-eye {
  position: absolute;
  left: 28px;
  top: 13px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--text);
}

.stork-body {
  position: absolute;
  left: 35px;
  top: 48px;
  width: 55px;
  height: 88px;
  border-radius: 50%;
  background: white;
  border: 3px solid var(--text);
  transform: rotate(-8deg);
}

.stork-wing {
  position: absolute;
  left: 8px;
  top: 58px;
  width: 62px;
  height: 47px;
  border-radius: 50%;
  background: #f8f8f8;
  border: 3px solid var(--text);
  transform: rotate(25deg);
}

.stork-leg {
  position: absolute;
  bottom: 2px;
  width: 3px;
  height: 55px;
  background: var(--accent);
}

.stork-leg.one {
  left: 52px;
  transform: rotate(7deg);
}

.stork-leg.two {
  left: 73px;
  transform: rotate(-5deg);
}

/* =========================================================
   COMMON
========================================================= */

.hidden {
  display: none !important;
}

.container {
  width: min(1100px, calc(100% - 30px));
  margin: 0 auto;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.primary-btn {
  border: 0;
  background: var(--accent);
  color: white;
  font-weight: 700;
  border-radius: 12px;
  padding: 12px 18px;
  transition: .2s;
}

.primary-btn:hover {
  background: var(--accent-hover);
  transform: translateY(-1px);
}

.secondary-btn {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  border-radius: 11px;
  padding: 10px 14px;
}

/* =========================================================
   AUTH
========================================================= */

.auth-screen {
  min-height: 100vh;
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px 15px;
}

.auth-card {
  width: min(440px, 100%);
  padding: 34px;
  border-radius: 25px;
  background: var(--card);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}

.logo {
  text-align: center;
  margin-bottom: 25px;
}

.logo h1 {
  margin: 0;
  color: var(--accent);
  font-size: 48px;
  line-height: 1;
  letter-spacing: -2px;
}

.logo p {
  margin: 9px 0 0;
  color: var(--muted);
}

.auth-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-bottom: 22px;
}

.auth-tab {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  border-radius: 11px;
  padding: 11px;
}

.auth-tab.active {
  color: white;
  background: var(--accent);
  border-color: var(--accent);
}

.form-group {
  margin-bottom: 15px;
}

.form-group label {
  display: block;
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 6px;
}

.form-group input {
  width: 100%;
  padding: 13px 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  outline: none;
  background: var(--bg);
  color: var(--text);
}

.form-group input:focus {
  border-color: var(--accent);
}

.auth-message {
  min-height: 22px;
  margin-top: 12px;
  text-align: center;
  color: var(--danger);
  font-size: 14px;
  line-height: 1.4;
}

/* =========================================================
   APP HEADER
========================================================= */

.app-header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(
    in srgb,
    var(--card) 94%,
    transparent
  );
  backdrop-filter: blur(15px);
  border-bottom: 1px solid var(--border);
}

.header-inner {
  min-height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.header-logo {
  color: var(--accent);
  font-size: 29px;
  font-weight: 900;
  letter-spacing: -1px;
}

.header-actions {
  display: flex;
  gap: 7px;
}

.icon-btn {
  width: 42px;
  height: 42px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: transparent;
  color: var(--text);
}

/* =========================================================
   MAIN
========================================================= */

.main-layout {
  width: min(900px, calc(100% - 30px));
  margin: 25px auto 80px;
  position: relative;
  z-index: 1;
}

/* =========================================================
   SETTINGS
========================================================= */

.settings {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: var(--shadow);
}

.settings h2 {
  margin: 0 0 15px;
}

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}

.setting-row:last-child {
  border-bottom: 0;
}

.setting-title {
  font-weight: 700;
}

.setting-description {
  margin-top: 3px;
  color: var(--muted);
  font-size: 13px;
}

.setting-row select {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px;
  background: var(--bg);
  color: var(--text);
}

/* =========================================================
   CREATE POST
========================================================= */

.create-post {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: var(--shadow);
}

.create-post textarea {
  width: 100%;
  min-height: 100px;
  resize: vertical;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font-size: 16px;
}

.create-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.post-hint {
  color: var(--muted);
  font-size: 13px;
}

/* =========================================================
   FEED
========================================================= */

.feed {
  display: grid;
  gap: 18px;
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 45px 20px;
  background: var(--card);
  border: 1px dashed var(--border);
  border-radius: 18px;
}

/* =========================================================
   POST
========================================================= */

.post {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  box-shadow: var(--shadow);
}

.post-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  width: 45px;
  height: 45px;
  flex: 0 0 45px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--accent);
  color: white;
  font-weight: 800;
}

.username {
  font-weight: 750;
}

.post-date {
  margin-top: 2px;
  color: var(--muted);
  font-size: 12px;
}

.post-text {
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  margin-bottom: 15px;
}

.post-media {
  width: 100%;
  max-height: 500px;
  object-fit: cover;
  border-radius: 14px;
  margin-bottom: 15px;
}

.post-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.action-btn {
  border: 1px solid var(--border);
  border-radius: 10px;
  background: transparent;
  color: var(--text);
  padding: 8px 12px;
}

.action-btn:hover {
  color: var(--accent);
  border-color: var(--accent);
}

.action-btn.active {
  color: var(--accent);
  border-color: var(--accent);
}

/* =========================================================
   COMMENTS
========================================================= */

.comments {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}

.comment {
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  line-height: 1.45;
}

.comment strong {
  margin-right: 5px;
}

.comment-form {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.comment-form input {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  background: var(--bg);
  color: var(--text);
  outline: none;
}

.comment-form button {
  border: 0;
  border-radius: 10px;
  background: var(--accent);
  color: white;
  padding: 0 14px;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 650px) {

  .auth-card {
    padding: 25px 20px;
  }

  .logo h1 {
    font-size: 43px;
  }

  .stork {
    right: -25px;
    top: 70px;
    transform: scale(.65);
    transform-origin: top right;
  }

  .container {
    width: calc(100% - 18px);
  }

  .main-layout {
    width: calc(100% - 18px);
    margin-top: 15px;
  }

  .post {
    padding: 16px;
  }

  .create-bottom {
    align-items: flex-end;
  }

  .post-hint {
    max-width: 55%;
  }

  .setting-row {
    align-items: flex-start;
    flex-direction: column;
  }

  .setting-row select {
    width: 100%;
  }
}
</style>
</head>

     AUTH SCREEN
======================================================== -->

<div id="authScreen" class="auth-screen">

      <h1>Hutka</h1>
      <p id="authSubtitle">
        Беларуская сацыяльная сетка
      </p>
    </div>


    <div class="auth-tabs">

      <button
        id="loginTab"
        class="auth-tab active"
        type="button"
        onclick="switchAuth('login')">
        Увайсці
      </button>

      <button
        id="registerTab"
        class="auth-tab"
        type="button"
        onclick="switchAuth('register')">
        Рэгістрацыя
      </button>

    </div>


    <form id="authForm">

      <!-- NAME -->
      <div
        id="nameGroup"
        class="form-group hidden">

        <label id="nameLabel">
          Имя
        </label>

        <input
          id="name"
          type="text"
          maxlength="50"
          autocomplete="name">
      </div>


      <!-- USERNAME -->
      <div class="form-group">

        <label id="usernameLabel">
          Username
        </label>

        <input
          id="username"
          type="text"
          maxlength="24"
          autocomplete="username"
          required>

      </div>


      <!-- PASSWORD -->
      <div class="form-group">

        <label id="passwordLabel">
          Пароль
        </label>

        <input
          id="password"
          type="password"
          minlength="6"
          autocomplete="current-password"
          required>

      </div>


      <!-- CONFIRM -->
      <div
        id="confirmPasswordGroup"
        class="form-group hidden">

        <label id="confirmPasswordLabel">
          Повторите пароль
        </label>

        <input
          id="confirmPassword"
          type="password"
          minlength="6"
          autocomplete="new-password">

      </div>


      <button
        id="authButton"
        class="primary-btn"
        style="width:100%;"
        type="submit">
        Увайсці
      </button>


      <div
        id="authMessage"
        class="auth-message">
      </div>

    </form>

  </div>
</div>


<!-- =======================================================
     MAIN APP
======================================================== -->

<div id="mainApp" class="hidden">

  <header class="app-header">

    <div class="container header-inner">

      <div class="header-logo">
        Hutka
      </div>

      <div class="header-actions">

        <button
          class="icon-btn"
          type="button"
          onclick="toggleTheme()"
          title="Тема">
          🌓
        </button>

        <button
          class="icon-btn"
          type="button"
          onclick="toggleSettings()"
          title="Настройки">
          ⚙️
        </button>

        <button
          class="icon-btn"
          type="button"
          onclick="logout()"
          title="Выйти">
          ↪
        </button>

      </div>

    </div>

  </header>


  <main class="main-layout">


    <!-- ===================================================
         SETTINGS
    ==================================================== -->

    <section
      id="settingsPanel"
      class="settings hidden">

      <h2 id="settingsTitle">
        Настройки
      </h2>


      <div class="setting-row">

        <div>
          <div
            class="setting-title"
            id="themeTitle">
            Тема
          </div>

          <div
            class="setting-description"
            id="themeDescription">
            Светлая или тёмная тема
          </div>
        </div>


        <select
          id="themeSelect"
          onchange="changeTheme(this.value)">

          <option value="light">
            ☀️ Светлая
          </option>

          <option value="dark">
            🌙 Тёмная
          </option>

        </select>

      </div>


      <div class="setting-row">

        <div>
          <div
            class="setting-title"
            id="languageTitle">
            Язык
          </div>

          <div
            class="setting-description"
            id="languageDescription">
            Язык интерфейса
          </div>
        </div>


        <select
          id="languageSelect"
          onchange="changeLanguage(this.value)">

          <option value="ru">
            Русский
          </option>

          <option value="by">
            Беларуская
          </option>

          <option value="en">
            English
          </option>

        </select>

      </div>

    </section>


    <!-- ===================================================
         CREATE POST
    ==================================================== -->

    <section class="create-post">

      <textarea
        id="postText"
        maxlength="280"
        placeholder="Что у вас нового?">
      </textarea>


      <div class="create-bottom">

        <span
          id="postHint"
          class="post-hint">
          Расскажите что-нибудь друзьям
        </span>


        <button
          id="publishButton"
          class="primary-btn"
          type="button"
          onclick="createPost()">
          Опубликовать
        </button>

      </div>

    </section>


    <!-- ===================================================
         FEED
    ==================================================== -->

    <section
      id="feed"
      class="feed">

      <div class="empty">
        Загрузка Hutka…
      </div>

    </section>

  </main>

</div>

    send:

    repost:
      'Repost',

    noPosts:

    loading:

    serverError:

    passwordMismatch:
      'Passwords do not match.',

function t(key) {

  return (
    translations[currentLanguage]?.[key]
    ||
    translations.ru[key]
    ||
    key
  );
}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return '';
  }

  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}


/* =========================================================
   THEME
========================================================= */

function applyTheme() {

  document.body.classList.toggle(
    'dark',
    currentTheme === 'dark'
  );


  const select =
    document.getElementById(
      'themeSelect'
    );


  if (select) {
    select.value = currentTheme;
  }
}


function toggleTheme() {

  currentTheme =
    currentTheme === 'dark'
      ? 'light'
      : 'dark';


  localStorage.setItem(
    'hutka_theme',
    currentTheme
  );


  applyTheme();
}


function changeTheme(theme) {

  if (
    theme !== 'light' &&
    theme !== 'dark'
  ) {
    return;
  }


  currentTheme = theme;


  localStorage.setItem(
    'hutka_theme',
    theme
  );


  applyTheme();
}

/* =========================================================
   AUTH SWITCH
========================================================= */

function switchAuth(mode) {

  currentAuthMode =
    mode;


  const loginTab =
    document.getElementById(
      'loginTab'
    );

  const registerTab =
    document.getElementById(
      'registerTab'
    );

  const nameGroup =
    document.getElementById(
      'nameGroup'
    );

  const confirmGroup =
    document.getElementById(
      'confirmPasswordGroup'
    );

  const authButton =
    document.getElementById(
      'authButton'
    );

  const message =
    document.getElementById(
      'authMessage'
    );


  message.textContent = '';


  if (mode === 'login') {

    loginTab.classList.add(
      'active'
    );

    registerTab.classList.remove(
      'active'
    );

    nameGroup.classList.add(
      'hidden'
    );

    confirmGroup.classList.add(
      'hidden'
    );

    authButton.textContent =
      t('loginButton');


  } else {

    loginTab.classList.remove(
      'active'
    );

    registerTab.classList.add(
      'active'
    );

    nameGroup.classList.remove(
      'hidden'
    );

    confirmGroup.classList.remove(
      'hidden'
    );

    authButton.textContent =
      t('registerButton');
  }
}


/* =========================================================
   API REQUEST
========================================================= */

async function apiRequest(
  path,
  options = {}
) {

  const config = {
    credentials: 'include',

    ...options,

    headers: {
      ...(options.headers || {})
    }
  };


  /*
   * JSON автоматически добавляем
   * только если body является строкой JSON.
   */

  if (
    typeof config.body === 'string'
    &&
    !config.headers['Content-Type']
  ) {

    config.headers['Content-Type'] =
      'application/json';
  }


  const response =
    await fetch(
      API_BASE + path,
      config
    );


  let data = null;


  try {

    data =
      await response.json();

  } catch {

    data = null;
  }


  if (!response.ok) {

    const error =
      data?.error
      ||
      data?.message
      ||
      `HTTP ${response.status}`;


    throw new Error(
      error
    );
  }


  return data;
}


/* =========================================================
   AUTH CHECK
========================================================= */

async function checkAuth() {

  try {

    const data =
      await apiRequest(
        '/api/me'
      );


    if (
      data &&
      data.user
    ) {

      currentUser =
        data.user;


      showMain();


      await loadFeed();


      return true;
    }


  } catch (error) {

    console.warn(
      'AUTH CHECK:',
      error
    );
  }


  showAuth();


  return false;
}

/* =========================================================
   AUTH FORM
========================================================= */

document
  .getElementById(
    'authForm'
  )
  .addEventListener(
    'submit',
    async function(event) {

      event.preventDefault();


      const name =
        document
          .getElementById(
            'name'
          )
          .value
          .trim();


      const username =
        document
          .getElementById(
            'username'
          )
          .value
          .trim()
          .replace(
            /^@/,
            ''
          )
          .toLowerCase();


      const password =
        document
          .getElementById(
            'password'
          )
          .value;


      const confirmPassword =
        document
          .getElementById(
            'confirmPassword'
          )
          .value;


      const message =
        document.getElementById(
          'authMessage'
        );


      const button =
        document.getElementById(
          'authButton'
        );


      message.textContent = '';


      if (
        currentAuthMode ===
        'register'
        &&
        !name
      ) {

        message.textContent =
          t('nameRequired');

        return;
      }


      if (!username) {

        message.textContent =
          t('usernameRequired');

        return;
      }


      if (!password) {

        message.textContent =
          t('passwordRequired');

        return;
      }


      if (
        currentAuthMode ===
        'register'
        &&
        password !==
        confirmPassword
      ) {

        message.textContent =
          t('passwordMismatch');

        return;
      }


      button.disabled = true;


      try {

        let data;


        if (
          currentAuthMode ===
          'register'
        ) {

          /*
           * ВАЖНО:
           * server.js ожидает name,
           * username и password.
           */

          data =
            await apiRequest(
              '/api/auth/register',
              {
                method: 'POST',

                body:
                  JSON.stringify({

                    name,

                    username,

                    password
                  })
              }
            );


        } else {

          data =
            await apiRequest(
              '/api/auth/login',
              {
                method: 'POST',

                body:
                  JSON.stringify({

                    username,

                    password
                  })
              }
            );
        }


        if (
          !data ||
          !data.user
        ) {

          throw new Error(
            'Сервер не вернул данные пользователя'
          );
        }


        currentUser =
          data.user;


        document
          .getElementById(
            'authForm'
          )
          .reset();


        showMain();


        await loadFeed();


      } catch (error) {

        console.error(
          'AUTH ERROR:',
          error
        );


        message.textContent =
          error.message
          ||
          t('serverError');


      } finally {

        button.disabled = false;
      }

    }
  );


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

  try {

    await apiRequest(
      '/api/auth/logout',
      {
        method: 'POST'
      }
    );

  } catch (error) {

    console.warn(
      'LOGOUT ERROR:',
      error
    );

  } finally {

    currentUser = null;

    showAuth();

    switchAuth('login');
  }
}


/* =========================================================
   LOAD FEED
========================================================= */

async function loadFeed() {

  const feed =
    document.getElementById(
      'feed'
    );


  feed.innerHTML =
    `<div class="empty">${escapeHTML(t('loading'))}</div>`;


  try {

    const data =
      await apiRequest(
        '/api/posts'
      );


    const posts =
      Array.isArray(data?.posts)
        ? data.posts
        : [];


    renderPosts(posts);


  } catch (error) {

    console.error(
      'FEED ERROR:',
      error
    );


    feed.innerHTML = `

      <div class="empty">

        ${escapeHTML(
          error.message ||
          t('serverError')
        )}

        <br><br>

        <button
          class="secondary-btn"
          onclick="loadFeed()">
          ↻ Повторить
        </button>

      </div>

    `;
  }
}


/* =========================================================
   RENDER POSTS
========================================================= */

function renderPosts(posts) {

  const feed =
    document.getElementById(
      'feed'
    );


  if (!posts.length) {

    feed.innerHTML =
      `<div class="empty">${escapeHTML(t('noPosts'))}</div>`;

    return;
  }


  feed.innerHTML =
    posts
      .map(
        post =>
          renderPost(post)
      )
      .join('');
}


function renderPost(post) {

  const user =
    post.user || {};


  const username =
    user.username
    ||
    'Hutka';


  const initial =
    username
      .charAt(0)
      .toUpperCase();


  const text =
    post.text || '';


  const date =
    formatDate(
      post.createdAt
    );


  const likes =
    Number(
      post.likes || 0
    );


  const comments =
    Number(
      post.comments || 0
    );


  const reposts =
    Number(
      post.reposts || 0
    );


  const liked =
    post.liked
      ? 'active'
      : '';


  const reposted =
    post.reposted
      ? 'active'
      : '';


  let mediaHTML = '';


  if (post.media) {

    const mediaUrl =
      post.media.startsWith('http')
        ? post.media
        : API_BASE + post.media;


    mediaHTML = `

      <img
        class="post-media"
        src="${escapeHTML(mediaUrl)}"
        alt="Фото"
        loading="lazy">

    `;
  }


  return `

    <article
      class="post"
      data-post-id="${Number(post.id)}">


      <div class="post-header">

        <div class="user-info">

          <div class="avatar">
            ${escapeHTML(initial)}
          </div>


          <div>

            <div class="username">
              @${escapeHTML(username)}
            </div>

            <div class="post-date">
              ${escapeHTML(date)}
            </div>

          </div>

        </div>

      </div>


      ${
        text
          ? `
            <div class="post-text">
              ${escapeHTML(text)}
            </div>
          `
          : ''
      }


      ${mediaHTML}


      <div class="post-actions">

        <button
          class="action-btn ${liked}"
          onclick="likePost(${Number(post.id)})">

          ❤️
          ${likes}

        </button>


        <button
          class="action-btn"
          onclick="toggleComments(${Number(post.id)})">

          💬
          ${t('comments')}
          ${comments}

        </button>


        <button
          class="action-btn ${reposted}"
          onclick="repostPost(${Number(post.id)})">

          🔁
          ${t('repost')}
          ${reposts}

        </button>

      </div>


      <div
        id="comments-${Number(post.id)}"
        class="comments hidden">

        <div
          id="comments-list-${Number(post.id)}">

        </div>


        <form
          class="comment-form"
          onsubmit="
            submitComment(
              event,
              ${Number(post.id)}
            )
          ">

          <input
            id="comment-input-${Number(post.id)}"
            type="text"
            maxlength="500"
            placeholder="${escapeHTML(t('commentPlaceholder'))}"
            required>


          <button type="submit">
            ${escapeHTML(t('send'))}
          </button>

        </form>

      </div>

    </article>

  `;
}


/* =========================================================
   DATE
========================================================= */

function formatDate(value) {

  if (!value) {
    return '';
  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return '';
  }


  try {

    return date.toLocaleString(
      currentLanguage === 'en'
        ? 'en-US'
        : currentLanguage === 'by'
          ? 'be-BY'
          : 'ru-RU',

      {
        dateStyle: 'short',
        timeStyle: 'short'
      }
    );

  } catch {

    return date.toLocaleString();
  }
}


/* =========================================================
   CREATE POST
========================================================= */

async function createPost() {

  const textarea =
    document.getElementById(
      'postText'
    );


  const text =
    textarea.value.trim();


  if (!text) {

    alert(
      t('emptyPost')
    );

    return;
  }


  const button =
    document.getElementById(
      'publishButton'
    );


  button.disabled = true;


  try {

    /*
     * server.js принимает
     * multipart/form-data.
     *
     * Для текста можно отправить
     * обычный FormData.
     */

    const formData =
      new FormData();


    formData.append(
      'text',
      text
    );


    const response =
      await fetch(
        API_BASE +
        '/api/posts',
        {
          method: 'POST',

          credentials:
            'include',

          body:
            formData
        }
      );


    let data = null;


    try {
      data =
        await response.json();
    } catch {}


    if (!response.ok) {

      throw new Error(
        data?.error
        ||
        `HTTP ${response.status}`
      );
    }


    textarea.value = '';


    await loadFeed();


  } catch (error) {

    console.error(
      'CREATE POST ERROR:',
      error
    );


    alert(
      error.message
      ||
      t('serverError')
    );


  } finally {

    button.disabled = false;
  }
}

/* =========================================================
   COMMENTS
========================================================= */

async function toggleComments(
  postId
) {

  const box =
    document.getElementById(
      `comments-${postId}`
    );


  if (!box) {
    return;
  }


  const wasHidden =
    box.classList.contains(
      'hidden'
    );


  box.classList.toggle(
    'hidden'
  );


  if (wasHidden) {

    await loadComments(
      postId
    );
  }
}


async function loadComments(
  postId
) {

  const list =
    document.getElementById(
      `comments-list-${postId}`
    );


  if (!list) {
    return;
  }


  list.innerHTML =
    `<div style="color:var(--muted)">Загрузка…</div>`;


  try {

    const data =
      await apiRequest(
        `/api/posts/${postId}/comments`
      );


    const comments =
      Array.isArray(
        data?.comments
      )
        ? data.comments
        : [];


    if (!comments.length) {

      list.innerHTML =
        `<div style="color:var(--muted);padding:8px 0">Пока нет комментариев.</div>`;

      return;
    }


    list.innerHTML =
      comments
        .map(
          comment => {

            const username =
              comment.user?.username
              ||
              'Hutka';


            return `

              <div class="comment">

                <strong>
                  @${escapeHTML(username)}
                </strong>

                ${escapeHTML(
                  comment.text
                )}

              </div>

            `;
          }
        )
        .join('');


  } catch (error) {

    console.error(
      'COMMENTS ERROR:',
      error
    );


    list.innerHTML =
      `<div style="color:var(--danger)">Не удалось загрузить комментарии.</div>`;
  }
}


async function submitComment(
  event,
  postId
) {

  event.preventDefault();


  const input =
    document.getElementById(
      `comment-input-${postId}`
    );


  if (!input) {
    return;
  }


  const text =
    input.value.trim();


  if (!text) {
    return;
  }


  try {

    await apiRequest(
      `/api/posts/${postId}/comments`,
      {
        method: 'POST',

        body:
          JSON.stringify({
            text
          })
      }
    );


    input.value = '';


    await loadComments(
      postId
    );


    await loadFeed();


    /*
     * После обновления ленты
     * снова открываем комментарии.
     */

    const box =
      document.getElementById(
        `comments-${postId}`
      );


    if (box) {

      box.classList.remove(
        'hidden'
      );

      await loadComments(
        postId
      );
    }


  } catch (error) {

    console.error(
      'COMMENT ERROR:',
      error
    );


    alert(
      error.message
      ||
      t('serverError')
    );
  }
}

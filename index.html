<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hutka</title><style>
:root{--bg:#f5f6f7;--card:#fff;--text:#17191c;--muted:#747a82;--line:#e2e5e8;--red:#d51f3a;--green:#168b45}
:root.dark{--bg:#0f1512;--card:#171e1a;--text:#f3f5f4;--muted:#9aa59f;--line:#29322d;--red:#ef4960}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.app{max-width:1080px;margin:auto;display:grid;grid-template-columns:235px 620px 270px;gap:22px;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.055;background-image:radial-gradient(circle at 8% 20%,var(--green) 0 2px,transparent 3px),radial-gradient(circle at 92% 80%,var(--red) 0 2px,transparent 3px);background-size:42px 42px}
aside{padding:22px 10px;position:sticky;top:0;height:100vh}.logo{font-size:30px;font-weight:900;margin:5px 12px 25px;letter-spacing:-1.5px}.logo span{color:var(--red)}.nav button{width:100%;display:flex;gap:13px;padding:13px 14px;border:0;background:transparent;color:var(--text);border-radius:13px;font-weight:650;text-align:left}.nav button:hover,.nav .active{background:color-mix(in srgb,var(--text) 8%,transparent)}.nav b{font-size:20px;width:22px;text-align:center}.new,.postbtn{background:var(--red);color:white;border:0;border-radius:12px;padding:11px 16px;font-weight:750}.new{margin:20px 12px;width:calc(100% - 24px)}
main{border-left:1px solid var(--line);border-right:1px solid var(--line);position:relative}.top{height:58px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.top h2{font-size:18px}.mobile-logo{display:none}
.composer,.post{background:var(--card);padding:17px;border-bottom:1px solid var(--line)}.row,.posthead{display:flex;gap:12px}.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#25282c,#8a9097);color:white;font-weight:800;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.composer textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--text);font-size:16px;min-height:58px}.composebar{display:flex;justify-content:space-between;align-items:center;margin-left:55px}.attach{font-size:21px;color:var(--red);cursor:pointer}.preview{margin:10px 0 4px 55px;position:relative}.preview img{max-width:100%;max-height:280px;border-radius:14px}.remove{position:absolute;top:8px;right:8px;border:0;border-radius:50%;background:#000b;color:#fff;width:30px;height:30px}.who{flex:1}.who strong{font-size:15px;cursor:pointer}.who span{color:var(--muted);font-size:13px;margin-left:5px}.post p{line-height:1.5;margin:9px 0 12px;font-size:15.5px}.postphoto{max-width:100%;border-radius:15px;max-height:450px;object-fit:cover;margin-bottom:10px}.actions{display:flex;justify-content:space-between;max-width:480px}.actions button{border:0;background:transparent;color:var(--muted);padding:7px;border-radius:9px}.actions button:hover{background:color-mix(in srgb,var(--text) 7%,transparent)}.actions .liked{color:var(--red)}
.right{padding:22px 0}.search{background:var(--card);border:1px solid var(--line);padding:11px 13px;border-radius:13px}.search input{width:90%;border:0;outline:0;background:transparent;color:var(--text)}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:17px;padding:15px}.panel h3{margin:0 0 12px}.person{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.person .mini{width:38px;height:38px}.person b{font-size:13px}.person small{color:var(--muted)}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--card)}.tabs button{flex:1;padding:14px 5px;border:0;background:transparent;color:var(--muted);font-weight:700}.tabs .sel{color:var(--red);border-bottom:2px solid var(--red)}
.profile{display:none;background:var(--card);padding:20px;border-bottom:1px solid var(--line)}.profile.show{display:block}.cover{height:100px;border-radius:14px;background:linear-gradient(135deg,var(--green),#e7e2d3 48%,var(--red));opacity:.75}.profilemain{display:flex;gap:12px;align-items:end;margin-top:-24px}.profile .avatar{width:72px;height:72px;border:4px solid var(--card)}.bio{margin:10px 0}.statrow{display:flex;gap:25px;color:var(--muted);font-size:13px}.closeprofile{float:right;border:0;background:var(--bg);color:var(--text);border-radius:10px;padding:7px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{background:var(--card);color:var(--text);width:min(560px,100%);border-radius:22px 22px 0 0;padding:20px;max-height:90vh;overflow:auto}.field{margin:15px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:11px}.settingrow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.modal-actions{display:flex;gap:10px;margin-top:18px}.secondary{background:var(--bg);color:var(--text);border:1px solid var(--line);padding:11px 15px;border-radius:11px}
.bottom{display:none}.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#17191c;color:#fff;padding:11px 15px;border-radius:12px;opacity:0;z-index:30;transition:.2s}.toast.show{opacity:1}
@media(max-width:900px){.app{grid-template-columns:72px 620px;justify-content:center}.right{display:none}.logo{font-size:0}.logo span{font-size:30px}.nav button{justify-content:center}.nav button span{display:none}.new{font-size:0}}
@media(max-width:650px){.app{display:block}.app>aside{display:none}main{border:0;padding-bottom:70px}.mobile-logo{display:block;font-weight:900}.mobile-logo span{color:var(--red)}.top h2{display:none}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;height:64px;background:var(--card);border-top:1px solid var(--line);z-index:10;justify-content:space-around;align-items:center}.bottom button{border:0;background:none;color:var(--text);font-size:21px;padding:9px}.composer,.post{padding:14px}}
</style></head><body><div class="app">
<aside><div class="logo">hut<span>ka</span></div><nav class="nav">
<button class="active" onclick="showFeed()"><b>⌂</b><span data-i="home">Лента</span></button>
<button onclick="focusSearch()"><b>⌕</b><span data-i="search">Поиск</span></button>
<button onclick="toast('Новых уведомлений пока нет')"><b>♡</b><span data-i="notifications">Уведомления</span></button>
<button onclick="toast('Раздел сообщений')"><b>✉</b><span data-i="messages">Сообщения</span></button>
<button onclick="openSettings()"><b>◉</b><span data-i="profile">Профиль</span></button></nav><button class="new" onclick="focusComposer()">＋ <span data-i="newpost">Новый пост</span></button></aside>
<main><header class="top"><div class="mobile-logo">hut<span>ka</span></div><h2 id="pageTitle">Для вас</h2><button onclick="openSettings()" style="border:0;background:none;color:var(--text);font-size:20px">⚙</button></header>
<div id="profileView" class="profile"></div>
<section class="composer" id="composer"><div class="row"><div class="avatar" id="composerAvatar">МК</div><textarea id="text" maxlength="280" placeholder="Што ў цябе на душы?"></textarea></div><div id="preview" class="preview"></div><div class="composebar"><div><label class="attach">📷 <input id="photo" type="file" accept="image/*" hidden></label> <span style="font-size:12px;color:var(--muted)"><span id="count">0</span>/280</span></div><button class="postbtn" onclick="publish()" data-i="publish">Опублікаваць</button></div></section>
<div class="tabs"><button class="sel" onclick="filterTab(this,'all')" data-i="posts">Посты</button><button onclick="filterTab(this,'media')" data-i="media">Медиа</button><button onclick="filterTab(this,'liked')" data-i="liked">Понравилось</button></div>
<section id="feed"></section></main>
<section class="right"><div class="search" id="searchBox">⌕ <input id="searchInput" placeholder="Поиск людей и публикаций" oninput="doSearch()"></div><div class="panel"><h3>Люди в Hutka</h3><div id="people"></div></div><div class="panel"><h3>Што адбываецца</h3><div class="person"><div><b>#Hutka</b><br><small>1 284 поста</small></div></div><div class="person"><div><b>Вечар у горадзе</b><br><small>418 постов</small></div></div></div></section></div>
<nav class="bottom"><button onclick="showFeed()">⌂</button><button onclick="focusSearch()">⌕</button><button onclick="focusComposer()">＋</button><button onclick="toast('Уведомлений нет')">♡</button><button onclick="openSettings()">⚙</button></nav>
<div class="modal open" id="auth"><div class="sheet"><h2>Добро пожаловать в Hutka 🇧🇾</h2><div class="field"><label>Имя <span id="authNameLabel">для регистрации</span></label><input id="authName" placeholder="Твоё имя"></div><div class="field"><label>Username</label><input id="authUsername" placeholder="@username"></div><div class="field"><label>Пароль</label><input id="authPassword" type="password" placeholder="Минимум 6 символов"></div><div class="modal-actions"><button class="postbtn" id="authSubmit" onclick="authSubmit()">Войти</button><button class="secondary" id="authSwitch" onclick="toggleAuthMode()">Регистрация</button></div><p id="authHint" style="color:var(--muted);font-size:13px;margin-bottom:0">Уже есть аккаунт? Войди по username.</p></div></div><div class="modal" id="settings"><div class="sheet"><h2 data-i="settings">Настройки</h2><div class="field"><label data-i="name">Имя</label><input id="nickname" value="Mbappe Kyllian"></div><div class="field"><label>Username</label><input id="handle" value="@you"></div><div class="field"><label data-i="avatar">Аватар</label><input id="avatarFile" type="file" accept="image/*"></div><div class="settingrow"><b data-i="dark">Тёмная тема</b><input id="dark" type="checkbox"></div><div class="field"><label data-i="language">Язык</label><select id="lang" onchange="setLanguage(this.value)"><option value="default">По умолчанию</option><option value="ru">Русский</option><option value="be">Беларуская</option><option value="en">English</option></select></div><div class="modal-actions"><button class="postbtn" onclick="saveSettings()" data-i="save">Сохранить</button><button class="secondary" onclick="closeSettings()" data-i="cancel">Отмена</button></div></div></div><div class="toast" id="toast"></div>
<script>
const T={ru:{home:'Лента',search:'Поиск',notifications:'Уведомления',messages:'Сообщения',profile:'Профиль',newpost:'Новый пост',publish:'Опубликовать',posts:'Посты',media:'Медиа',liked:'Понравилось',settings:'Настройки',name:'Имя',avatar:'Аватар',dark:'Тёмная тема',language:'Язык',save:'Сохранить',cancel:'Отмена',placeholder:'Что у тебя на душе?'},be:{home:'Стужка',search:'Пошук',notifications:'Апавяшчэнні',messages:'Паведамленні',profile:'Профіль',newpost:'Новы пост',publish:'Апублікаваць',posts:'Пасты',media:'Медыя',liked:'Спадабалася',settings:'Налады',name:'Імя',avatar:'Аватар',dark:'Цёмная тэма',language:'Мова',save:'Захаваць',cancel:'Скасаваць',placeholder:'Што ў цябе на душы?'},en:{home:'Home',search:'Search',notifications:'Notifications',messages:'Messages',profile:'Profile',newpost:'New post',publish:'Post',posts:'Posts',media:'Media',liked:'Liked',settings:'Settings',name:'Name',avatar:'Avatar',dark:'Dark theme',language:'Language',save:'Save',cancel:'Cancel',placeholder:"What's on your mind?"}};
let currentLang=localStorage.getItem('hutka_lang')||'default', currentUser=null, posts=[], photoData=null, authMode='login';
const $=id=>document.getElementById(id);
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',...opts});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Ошибка сервера');return d}
function applyLang(l){currentLang=l==='default'?'ru':l;document.querySelectorAll('[data-i]').forEach(e=>{const k=e.dataset.i;if(T[currentLang]?.[k])e.textContent=T[currentLang][k]});$('text').placeholder=T[currentLang].placeholder}
function setLanguage(v){applyLang(v);localStorage.setItem('hutka_lang',v);toast(v==='en'?'Language changed':v==='be'?'Мова зменена':'Язык изменён')}
function avatarHTML(u,cls='avatar'){return u.avatar?`<div class="${cls}"><img src="${u.avatar}" alt=""></div>`:`<div class="${cls}">${(u.name||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}</div>`}
function timeAgo(d){const m=Math.max(1,Math.floor((Date.now()-new Date(d.replace(' ','T')+'Z'))/60000));return m<60?`${m}м`:m<1440?`${Math.floor(m/60)}ч`:`${Math.floor(m/1440)}д`}
function render(list=posts){const f=$('feed');f.innerHTML='';list.forEach(p=>{const a=document.createElement('article');a.className='post';a.dataset.media=p.media?'1':'0';a.dataset.liked=p.liked?'1':'0';a.innerHTML=`<div class="posthead">${avatarHTML(p.user)}<div class="who"><strong>${escapeHtml(p.user.name)}</strong><span>${escapeHtml(p.user.handle)} · ${timeAgo(p.createdAt)}</span><p></p></div></div>`;a.querySelector('strong').onclick=()=>openProfile(p.user.username);a.querySelector('p').textContent=p.text;if(p.media){const im=document.createElement('img');im.className='postphoto';im.src=p.media;im.alt='';a.querySelector('.who').appendChild(im)}const ac=document.createElement('div');ac.className='actions';ac.innerHTML=`<button class="${p.liked?'liked':''}">${p.liked?'♥':'♡'} <span>${p.likes}</span></button><button>◯ ${p.comments}</button><button>↻</button><button>⌁</button>`;ac.children[0].onclick=()=>likePost(p.id);ac.children[1].onclick=()=>toast('Комментарии — следующий этап');ac.children[2].onclick=()=>toast('Репост — следующий этап');ac.children[3].onclick=()=>{navigator.clipboard?.writeText(location.origin+'/');toast('Ссылка скопирована')};a.querySelector('.who').appendChild(ac);f.appendChild(a)})}
async function loadPosts(){try{posts=(await api('/api/posts')).posts;render();renderPeople()}catch(e){toast(e.message)}}
async function likePost(id){if(!currentUser){openAuth();return}try{const d=await api('/api/posts/'+id+'/like',{method:'POST'});const p=posts.find(x=>x.id===id);if(p){p.liked=d.liked;p.likes=d.likes;render()}}catch(e){toast(e.message)}}
function filterTab(btn,type){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('sel'));btn.classList.add('sel');if(type==='all')render();if(type==='media')render(posts.filter(p=>p.media));if(type==='liked')render(posts.filter(p=>p.liked))}
async function openProfile(username){try{const d=await api('/api/users/'+encodeURIComponent(username));const u=d.user,v=$('profileView');v.classList.add('show');v.innerHTML=`<button class="closeprofile" onclick="vClose()">×</button><div class="cover"></div><div class="profilemain">${avatarHTML(u)}<div><h2 style="margin:0">${escapeHtml(u.name)}</h2><span style="color:var(--muted)">${escapeHtml(u.handle)}</span></div></div><div class="bio">${escapeHtml(u.bio||'')}</div><div class="statrow"><b>${u.posts} постов</b><b>${u.followers} подписчиков</b><b>${u.following} подписки</b></div>`;window.scrollTo({top:0,behavior:'smooth'})}catch(e){toast(e.message)}}
function vClose(){$('profileView').classList.remove('show')}
async function doSearch(){const q=$('searchInput').value.trim();if(!q){render();return}try{const d=await api('/api/search?q='+encodeURIComponent(q));render(d.posts);renderPeople(d.users)}catch(e){toast(e.message)}}
function renderPeople(list){const el=$('people');const arr=list||[];el.innerHTML=arr.length?arr.slice(0,5).map(u=>`<div class="person" onclick="openProfile('${u.username}')">${avatarHTML(u,'mini')}<div><b>${escapeHtml(u.name)}</b><br><small>${escapeHtml(u.handle)}</small></div></div>`).join(''):'<small style="color:var(--muted)">Войди, чтобы начать.</small>'}
function focusSearch(){$('searchInput').focus();$('searchBox').scrollIntoView({behavior:'smooth'})}
function focusComposer(){if(!currentUser){openAuth();return}$('composer').scrollIntoView({behavior:'smooth'});setTimeout(()=>$('text').focus(),250)}
$('text').oninput=e=>$('count').textContent=e.target.value.length;
$('photo').onchange=e=>{const f=e.target.files[0];if(!f)return;photoData=f;const r=new FileReader();r.onload=()=>{$('preview').innerHTML='<img src="'+r.result+'"><button class="remove" onclick="removePhoto()">×</button>'};r.readAsDataURL(f)};
function removePhoto(){photoData=null;$('preview').innerHTML='';$('photo').value=''}
async function publish(){if(!currentUser){openAuth();return}const text=$('text').value.trim();if(!text&&!photoData){toast('Добавь текст или фото');return}const fd=new FormData();fd.append('text',text);if(photoData)fd.append('photo',photoData);try{const d=await api('/api/posts',{method:'POST',body:fd});posts.unshift(d.post);$('text').value='';$('count').textContent=0;removePhoto();render();toast('Пост опубликован ✨')}catch(e){toast(e.message)}}
function openSettings(){if(!currentUser){openAuth();return}$('settings').classList.add('open');$('dark').checked=document.documentElement.classList.contains('dark');$('nickname').value=currentUser.name;$('handle').value=currentUser.username;$('lang').value=localStorage.getItem('hutka_lang')||'default'}
function closeSettings(){$('settings').classList.remove('open')}
async function saveSettings(){const fd=new FormData();fd.append('name',$('nickname').value);fd.append('username',$('handle').value);if($('avatarFile').files[0])fd.append('avatar',$('avatarFile').files[0]);try{const d=await api('/api/me',{method:'PUT',body:fd});currentUser=d.user;$('composerAvatar').outerHTML=avatarHTML(currentUser).replace('class="avatar"','id="composerAvatar" class="avatar"');document.documentElement.classList.toggle('dark',$('dark').checked);localStorage.setItem('hutka_dark',$('dark').checked);closeSettings();toast('Профиль сохранён');loadPosts()}catch(e){toast(e.message)}}
function showFeed(){vClose();window.scrollTo({top:0,behavior:'smooth'})}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1800)}
function openAuth(){$('auth').classList.add('open')}
function toggleAuthMode(){authMode=authMode==='login'?'register':'login';$('authName').style.display=authMode==='register'?'block':'none';$('authNameLabel').textContent=authMode==='register'?'для регистрации':'';$('authSubmit').textContent=authMode==='register'?'Создать аккаунт':'Войти';$('authSwitch').textContent=authMode==='register'?'У меня уже есть аккаунт':'Регистрация';$('authHint').textContent=authMode==='register'?'Username: латиница, цифры и _.':'Уже есть аккаунт? Войди по username.'}
async function authSubmit(){const body={name:$('authName').value,username:$('authUsername').value,password:$('authPassword').value};try{const d=await api(authMode==='register'?'/api/auth/register':'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});currentUser=d.user;$('auth').classList.remove('open');$('authPassword').value='';$('authUsername').value='';$('authName').value='';$('composerAvatar').outerHTML=avatarHTML(currentUser).replace('class="avatar"','id="composerAvatar" class="avatar"');toast(authMode==='register'?'Аккаунт создан ✨':'С возвращением!');loadPosts()}catch(e){toast(e.message)}}
function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
(async function(){if(localStorage.getItem('hutka_dark')==='true')document.documentElement.classList.add('dark');applyLang(currentLang);try{const me=await api('/api/me');currentUser=me.user;if(currentUser){$('auth').classList.remove('open');$('composerAvatar').outerHTML=avatarHTML(currentUser).replace('class="avatar"','id="composerAvatar" class="avatar"')}}catch{}await loadPosts();renderPeople()})()
</script></body></html>
